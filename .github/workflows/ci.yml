name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-build:
    # Pinned, not ubuntu-latest: the latest label migrates to a new Ubuntu
    # release mid-window (warning in the run log) and tool behavior must not
    # shift under a reproducibility-focused build.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the image base (python:3.12-slim-bookworm).
          python-version: '3.12'

      - name: Install dependencies (runtime + dev)
        run: |
          pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Ruff (lint, fails on violation)
        run: ruff check app/

      - name: Pytest (incl. metrics endpoint contract)
        run: python -m pytest app/tests -v

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint helm/skybyte-app

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Helm template
        run: |
          helm template skybyte-app helm/skybyte-app \
            --namespace devops-challenge > rendered.yaml

      # Core-workload schemas only: the chart uses scrape annotations (not
      # ServiceMonitor CRDs) precisely so no extra schema sources are needed.
      # No -ignore-missing-schemas: an unknown kind must fail the build.
      - name: Kubeconform (schema-validate rendered manifests)
        run: kubeconform -strict -summary rendered.yaml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt -check + validate
        run: |
          cd terraform
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      # Cross-arch RUN steps need binfmt handlers on the runner; without
      # QEMU the arm64 leg dies with "exec format error" during pip install.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # No push: this proves both architectures build.
      - name: Docker buildx (linux/amd64 + linux/arm64)
        run: docker buildx build --platform linux/amd64,linux/arm64 -t skybyte/app:ci .

      # Second build hits the layer cache; loads amd64 locally for Trivy.
      - name: Load amd64 image for scanning
        run: docker buildx build --platform linux/amd64 -t skybyte/app:ci --load .

      # Gate policy: fail on HIGH/CRITICAL that HAVE a fix available.
      # A digest-pinned base cannot take in-place package updates, so CVEs
      # disclosed with no fix shipped (status: affected / fix_deferred /
      # will_not_fix) would keep the pipeline permanently red with zero
      # action available — that is noise, and noise trains people to ignore
      # red. The moment Debian publishes a fix, the CVE re-enters scope,
      # the build goes red again, and the response is a one-line digest
      # refresh (DECISIONS.md, Trivy gate). Verified 2026-10-07: every
      # HIGH/CRITICAL on the pinned 3.12-slim-bookworm digest is unfixed.
      - name: Trivy filesystem scan
        # v-prefixed tag: the bare 0.28.0 ref does not exist and failed
        # action resolution before any step ran.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: skybyte/app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Install kyverno CLI
        run: |
          curl -sSL -o /tmp/kyverno.tgz \
            https://github.com/kyverno/kyverno/releases/download/v1.12.5/kyverno-cli_v1.12.5_linux_x86_64.tar.gz
          tar -xzf /tmp/kyverno.tgz -C /tmp kyverno
          sudo mv /tmp/kyverno /usr/local/bin/kyverno

      # CLI arg order: policies first, resources via --resource. The old
      # `--policy` flag does not exist in kyverno-cli 1.12.x — the step
      # errored out regardless of content (unknown flag = exit 1).
      - name: Kyverno — rendered manifests must pass
        run: kyverno apply policies/ --resource rendered.yaml --detailed-results

      - name: Kyverno — bad fixtures must be rejected
        run: |
          # Exit 1 = violations found = the policies actually bite.
          if kyverno apply policies/ --resource test/ >/dev/null 2>&1; then
            echo "ERROR: bad-manifest fixtures passed the policies"
            exit 1
          fi
          echo "OK: fixtures rejected as expected"