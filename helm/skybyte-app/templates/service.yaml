apiVersion: v1
kind: Service
metadata:
  name: {{ include "skybyte-app.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "skybyte-app.labels" . | nindent 4 }}
  # Prometheus scrape annotations (chosen over a ServiceMonitor — see
  # DECISIONS.md: no CRD dependency, so kubeconform validates with built-in
  # schemas; a ServiceMonitor would need prometheus-operator CRD schemas or
  # a weaker -ignore-missing-schemas run).
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/metrics"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "skybyte-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
