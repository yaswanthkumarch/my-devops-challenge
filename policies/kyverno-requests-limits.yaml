# Every container must declare requests AND limits.
# Catches the regression that bit during this exercise: the chart shipped no
# resources at all, and the namespace ResourceQuota (which tracks requests and
# limits keys) silently rejected pod creation at admission.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require resource requests and limits
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All containers in devops-challenge must declare CPU and memory
      requests and limits.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - devops-challenge
      validate:
        message: >-
          All containers must declare requests and limits for
          CPU and memory ("?*" = any non-empty value).
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
